version: "3.8"

services:
  bot:
    build: .
    container_name: media-downloader-bot
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./downloads:/app/downloads
      - ./temp:/app/temp
      - ./logs:/app/logs
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/media_bot.db
